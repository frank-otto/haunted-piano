<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Haunted Piano – play a 3D ghost grand piano</title>
<meta name="description" content="A ghost sits at a grand piano in a gothic music room. Hit the falling notes of Bach, Grieg and Chopin in time, repeat the ghost's melodies, or play freely. Easy/Medium/Hard, kids mode, EN/DE.">
<meta name="theme-color" content="#07060d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%B9%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-state="menu">
<canvas id="game" aria-label="Haunted Piano game"></canvas>
<div id="pops"></div>
<div id="banner"></div>
<div id="hud">
  <div class="chip" id="hScoreBox"><small data-t="score">Score</small><b id="hScore">0</b></div>
  <div class="chip" id="hComboBox"><small data-t="combo">Combo</small><b id="hCombo">0</b></div>
  <div class="chip" id="hAccBox"><small data-t="acc">Accuracy</small><b id="hAcc">–</b></div>
  <div class="chip" id="hSpiritBox"><small data-t="spirit">Spirit</small><i class="bar"><i id="hSpirit"></i></i></div>
  <div class="chip" id="hLivesBox"><small data-t="lives">Candles</small><b id="hLives"></b></div>
  <div class="chip" id="hRoundBox"><small data-t="round">Round</small><b id="hRound">1</b></div>
</div>
<div id="prog"><i id="hProg"></i></div>
<div id="hint"></div>
<button id="btnQuit" class="pill" aria-label="Finish">✕</button>
<div id="top">
  <button id="btnQ" class="pill">⚙</button>
  <button id="btnSound" class="pill on" aria-label="Sound">🔊</button>
  <button id="btnLang" class="pill">DE</button>
</div>
<div id="toast"></div>
<section id="menu" class="panel show">
  <h1 data-t="title">Haunted Piano</h1>
  <p class="sub" data-t="sub"></p>
  <ul class="how">
    <li><span>🎹</span><em data-t="h1"></em></li>
    <li><span>⌨️</span><em data-t="h2"></em></li>
    <li><span>👻</span><em id="h3"></em></li>
  </ul>
  <div id="songs" role="group">
    <button data-s="toccata"><b></b><small></small></button><button data-s="mountain"><b></b><small></small></button>
    <button data-s="funeral"><b></b><small></small></button><button data-s="dies"><b></b><small></small></button>
  </div>
  <button id="btnPlay" class="big" data-t="play">Play!</button>
  <div id="diff" role="group"><small data-t="difficulty"></small><button data-d="easy" data-t="d_easy"></button><button data-d="medium" data-t="d_medium"></button><button data-d="hard" data-t="d_hard"></button></div>
  <div class="row"><button id="btnEcho" data-t="echo">Ghost Echo</button><button id="btnFree" data-t="free">Free play</button><button id="btnKids" class="toggle" aria-pressed="false"><i></i><span data-t="kids">Kids mode</span></button></div>
</section>
<section id="end" class="panel">
  <h2 id="eTitle"></h2>
  <div class="scoreRow"><div id="eScore" class="score">0</div><div id="eGrade" class="grade"></div></div>
  <div id="eBest" class="best"></div>
  <div id="eStats" class="stats"></div>
  <label class="name"><span data-t="name">Your name</span><input id="eName" maxlength="18" value="Player" autocomplete="off"></label>
  <div class="row"><button id="btnCard" data-t="card"></button><button id="btnShare" data-t="share"></button></div>
  <div class="row"><button id="btnAgain" class="big" data-t="again"></button><button id="btnMenu" data-t="menu"></button></div>
</section>
<script src="js/sounds-src.js"></script>
<script src="js/game.bundle.js"></script>
</body>
</html>
